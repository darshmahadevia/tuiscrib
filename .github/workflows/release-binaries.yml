name: Standalone terminal binaries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-binaries.yml"
      - "bun.lock"
      - "package.json"
      - "packages/contracts/**"
      - "packages/terminal/**"
      - "README.md"
      - "LICENSE"
      - "docs/release.md"
      - "docs/portfolio-demo.md"
  pull_request:
    paths:
      - ".github/workflows/release-binaries.yml"
      - "bun.lock"
      - "package.json"
      - "packages/contracts/**"
      - "packages/terminal/**"
      - "README.md"
      - "LICENSE"
      - "docs/release.md"
      - "docs/portfolio-demo.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            artifact: tuiscrib-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            artifact: tuiscrib-darwin-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: tuiscrib-linux-arm64
          - target: linux-x64
            runner: ubuntu-latest
            artifact: tuiscrib-linux-x64
          - target: win32-x64
            runner: windows-latest
            artifact: tuiscrib-windows-x64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies for every target
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Typecheck
        run: bun run typecheck

      - name: Test release, capability, and config seams
        run: |
          bun test packages/terminal/src/release.test.ts
          bun test packages/terminal/src/server.test.ts
          bun test packages/terminal/src/credentials.test.ts --test-name-pattern "uses the protected platform config location"

      - name: Build artifacts and verify reproducibility
        run: bun run build:release -- --target "${{ matrix.target }}" --output artifacts --verify-reproducible

      - name: Smoke test first render and clean exit
        run: >-
          ${{ matrix.target == 'win32-x64' && 'node --experimental-strip-types' || 'bun run smoke:release' }}
          ${{ matrix.target == 'win32-x64' && 'packages/terminal/src/release-smoke.ts' || '' }}
          --binary "artifacts/${{ matrix.artifact }}"

      - name: Upload release binary and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-input-${{ matrix.target }}
          path: |
            artifacts/${{ matrix.artifact }}
            artifacts/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 90
